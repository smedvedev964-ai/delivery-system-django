{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191919">
  <title>{% block title %}Везём — доставка еды{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/site.css' %}" rel="stylesheet">
  <link href="{% static 'css/restaurant_theme.css' %}" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" aria-label="Везём">
      <span class="brand-mark">в</span>
      <span>везём<span class="brand-dot">.</span></span>
    </div>
    <form class="global-search" method="get" action="{% url 'home' %}">
      <span>⌕</span><input type="search" name="q" placeholder="Искать рестораны и кухню" value="{{ search_query|default:'' }}" aria-label="Поиск ресторанов">
    </form>
    <button class="address-pill" type="button" title="Адрес можно будет указать в личном кабинете">⌖ <span>Укажите адрес</span></button>
    <div class="top-time">◷ <span>Сейчас</span></div>
    <a class="top-icon" href="{% url 'cart:detail' %}" aria-label="Корзина" title="Корзина">🛒</a>
    <a class="top-icon" href="/accounts/login/" aria-label="Войти">♙</a>
  </div>
</header>
<main>
  {% if messages %}<div class="container pt-3" aria-live="polite">{% for message in messages %}<div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} mb-2">{{ message }}</div>{% endfor %}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="footer-inner">
    <span class="brand footer-brand"><span class="brand-mark">в</span><span>везём<span class="brand-dot">.</span></span></span>
    <span>Доставка любимой еды</span>
    <span>Учебный проект · 2026</span>
  </div>
</footer>
<script src="{% static 'js/site.js' %}" defer></script>
</body>
</html>
