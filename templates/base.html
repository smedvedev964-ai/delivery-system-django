{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8e8">
  <title>{% block title %}Везём — доставка рядом{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/site.css' %}" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="Везём — главная"><span class="brand-mark">в</span><span>везём<span class="brand-dot">.</span></span></a>
    <div class="delivery-address"><span class="address-pin">⌖</span><span><small>Доставим по адресу</small><strong>Укажите адрес</strong></span><span class="chevron">⌄</span></div>
    <nav class="header-actions" aria-label="Основная навигация">
      <a class="nav-link-custom" href="#catalog">Каталог</a>
      <a class="nav-link-custom" href="#about">О сервисе</a>
      <a class="login-link" href="/accounts/login/">Войти</a>
      <a class="cart-link" href="#catalog"><span>▣</span> Корзина <b>0</b></a>
    </nav>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="site-footer" id="about"><div class="container footer-inner"><a class="brand footer-brand" href="/"><span class="brand-mark">в</span><span>везём<span class="brand-dot">.</span></span></a><span>Доставка любимых продуктов и готовых блюд</span><span>Учебный проект · 2026</span></div></footer>
</body>
</html>
