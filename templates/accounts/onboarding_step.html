{% extends "base.html" %}
{% block title %}Настройка профиля — Везём{% endblock %}
{% block content %}
<section class="onboarding-panel">
  <div class="progress onboarding-progress mb-4" role="progressbar" aria-label="Заполнение профиля" aria-valuenow="{{ step_number }}" aria-valuemin="0" aria-valuemax="{{ step_count }}"><div class="progress-bar" style="width: {% widthratio step_number step_count 100 %}%"></div></div>
  <h1 class="mb-4">{{ title }}</h1>
  <form method="post" class="card"><div class="card-body">{% csrf_token %}
    {% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
    <button class="btn btn-dark w-100" type="submit">Продолжить</button>
    <button class="btn btn-link w-100 mt-2" type="submit" name="skip" value="1">Заполню позже</button>
  </div></form>
  <a class="btn btn-link px-0" href="{% url 'accounts:profile' %}">Открыть профиль</a>
</section>
{% endblock %}
