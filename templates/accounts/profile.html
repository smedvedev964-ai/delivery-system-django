{% extends "base.html" %}
{% block title %}Мой профиль — Везём{% endblock %}
{% block content %}
<section class="container py-5" style="max-width: 620px">
  <h1 class="mb-2">Мой профиль</h1><p class="text-muted">Логин: {{ user.username }}</p>
  <form method="post" class="card"><div class="card-body">{% csrf_token %}
    {% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
    <button class="btn btn-dark" type="submit">Сохранить изменения</button>
  </div></form>
  <a class="btn btn-link mt-3 px-0" href="{% url 'cart:detail' %}">Перейти в корзину</a>
</section>
{% endblock %}
